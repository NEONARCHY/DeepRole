<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Completed story illustration fixture</title>
<style>body{margin:0;background:#151a20;color:#eef3f7;font:14px/1.6 system-ui}main{max-width:690px;margin:auto;padding:16px 12px 150px;box-sizing:border-box}h1{font-size:18px}.ds-think-content{color:#8fa3b4;border-left:1px solid #455260;padding-left:12px}form{position:fixed;box-sizing:border-box;bottom:12px;left:50%;transform:translateX(-50%);width:min(690px,calc(100vw - 24px));padding:12px;border-radius:16px;background:#272e35}textarea{box-sizing:border-box;width:100%;color:#eef3f7;background:transparent;border:0;resize:none}form button{min-height:32px}</style>
</head><body><main><h1>Observatory · illustration order</h1><article data-role="assistant" data-message-id="story"><button>Thinking for 2 seconds</button><div class="ds-think-content">Private reasoning.</div></article></main><form><textarea aria-label="Message"></textarea><button id="send" type="button"><svg width="16" height="16"><rect x="3" y="3" width="10" height="10"/></svg></button></form>
<script>window.chrome={runtime:{id:"fixture"},storage:{local:{},session:{}}};</script><script type="module">
import { IllustrationsPresenter } from "/src/adapters/illustrations-dom.tsx";
import { DeepSeekDomAdapter } from "/src/adapters/deepseek-dom.ts";
import { syncSceneChoiceCards, dismissSceneChoiceCards } from "/src/adapters/deepseek-choices-dom.ts";
import { DEFAULT_IMAGE_SETTINGS } from "/src/core/image-generation.ts";
const params=new URL(location.href).searchParams,locale=params.get("locale")??"en";
document.documentElement.lang=locale;
const presenter=new IllustrationsPresenter(),adapter=new DeepSeekDomAdapter(),records=[],attempts=[];
const state={pinSceneChoices:params.has("pinned"),pinPortraits:false,adaptiveLayout:true};
window.imageCreates=0;window.sentScenes=[];
const options=["positive","neutral","negative","surprise"].map((kind,i)=>({kind,label:["Thank Mira","Ask about the sky","Stay quiet","Explore the dome"][i],text:"I choose "+kind+"."}));
const choices="<deeprole_choices>"+JSON.stringify({version:1,options})+"</deeprole_choices>";
const setGenerating=value=>{document.querySelector("#send").innerHTML=value?'<svg width="16" height="16"><rect x="3" y="3" width="10" height="10"/></svg>':'<svg width="16" height="16"><path d="M2 8L14 8"/></svg>';};
const actions={onCreate:async(target,text)=>{
  window.imageCreates++;window.sentScenes.push(text);
  const attempt={...target,id:"attempt",status:"preparing",createdAt:Date.now(),updatedAt:Date.now()};attempts.push(attempt);sync();
  await new Promise((resolve,reject)=>{window.finishImage=resolve;window.failImage=()=>{Object.assign(attempt,{status:"failed",error:"invalidPlan",updatedAt:Date.now()});sync();reject({code:"invalidPlan"});};});
  const canvas=document.createElement("canvas");canvas.width=768;canvas.height=432;const ctx=canvas.getContext("2d");ctx.fillStyle="#3c5664";ctx.fillRect(0,0,768,432);ctx.fillStyle="#95b9c9";ctx.fillRect(160,100,448,232);
  records.push({...target,id:"image",profileId:"synthetic",modelId:"synthetic",contentLevel:"off",prompt:"An observatory at dusk.",image:canvas.toDataURL(),headers:{},aspectRatio:"16:9",createdAt:Date.now(),updatedAt:Date.now()});attempts.splice(0);sync();
},onRepeat:async()=>{},onRemove:async()=>{},onDownload:async()=>{}};
function sync(){const generating=adapter.isGenerating();presenter.sync({enabled:true,generating,worldId:"world",chatId:"chat",chatUrl:"https://chat.deepseek.com/a/chat/s/chat",records,attempts,entities:[],settings:DEFAULT_IMAGE_SETTINGS,locale,actions});
syncSceneChoiceCards(true,generating,locale,async()=>true,document,{busy:false,onRequest:async()=>true},{...state,onToggle:key=>{state[key]=!state[key];sync();}});}
const row=()=>document.querySelector('[data-message-id="story"]');
const final=()=>{let node=row().querySelector(".ds-assistant-message-main-content");if(!node){node=document.createElement("div");node.className="ds-markdown ds-assistant-message-main-content";row().append(node);}return node;};
window.streamTest={sync,update:values=>{Object.assign(state,values);sync();},removeOptions:()=>{final().querySelectorAll("pre").forEach(node=>node.remove());sync();},addSavedReply:()=>{const older=document.createElement("article");older.dataset.role="assistant";older.dataset.messageId="older";older.style.cssText="padding:0 18px;margin-left:22px;border-left:1px solid transparent";older.innerHTML='<div class="ds-assistant-message-main-content"><p>The observatory before dusk.</p></div>';row().before(older);const canvas=document.createElement("canvas");canvas.width=16;canvas.height=9;records.push({worldId:"world",chatId:"chat",chatUrl:"https://chat.deepseek.com/a/chat/s/chat",messageKey:JSON.stringify(["message","older"]),id:"older-image",profileId:"synthetic",modelId:"synthetic",contentLevel:"off",prompt:"The observatory before dusk.",image:canvas.toDataURL(),headers:{},aspectRatio:"16:9",createdAt:1,updatedAt:1});sync();},setGenerating:value=>{setGenerating(value);sync();},prose:()=>{final().innerHTML="<p>Mira opens the observatory at dusk.</p>";sync();},choices:()=>{const code=document.createElement("pre");code.textContent=choices;final().append(code);sync();},appendEnding:()=>{const p=document.createElement("p");p.textContent="The final telescope light fades.";row().append(p);sync();},appendToolbar:()=>{const button=document.createElement("button");button.textContent="Copy";row().append(button);sync();},replace:()=>{const original=row(),next=original.cloneNode(true);next.querySelector("[data-deeprole-illustrations]")?.remove();original.replaceWith(next);sync();},service:()=>{const user=document.createElement("article");user.dataset.role="user";user.dataset.messageId="plan-request";user.textContent="[DeepRole Service]\n[DeepRole Image Plan]";const reply=document.createElement("article");reply.dataset.role="assistant";reply.dataset.messageId="plan-reply";reply.innerHTML='<div class="ds-think-content">Private service reasoning.</div>';row().after(user,reply);setGenerating(true);sync();},stopService:()=>{document.querySelector('[data-message-id="plan-reply"]').textContent='{"scene":"An observatory at dusk","characters":[]}';setGenerating(false);sync();},regenerate:()=>{dismissSceneChoiceCards(document,false);records.splice(0);attempts.splice(0);setGenerating(true);final().textContent="Regenerated scene begins.";sync();}};
sync();
</script></body></html>
