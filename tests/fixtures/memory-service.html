<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DeepRole memory analysis check</title>
<style>body{margin:0;background:#181818;color:#eee;font:15px/1.6 system-ui}main{max-width:690px;margin:40px auto;padding:16px}h1{font-size:20px}article{margin:20px 0}p{margin:12px 0}.ds-think-content{color:#888}textarea{box-sizing:border-box;width:100%;padding:14px;border:1px solid #444;border-radius:16px;background:#2b2b2b;color:white}</style>
</head><body><main><h1>DeepSeek · Observatory</h1><section id="conversation"><article data-role="assistant"><p>Mira hands Noah the brass key. Leon is waiting beside the archive door.</p></article></section><textarea aria-label="Message" placeholder="Message DeepSeek"></textarea></main>
<script type="module">
import { presentMemoryAnalysis, findServiceResponseElements, replaceArchivedMemoryPayloads } from '/src/adapters/deepseek-service-dom.ts';
import { parseServiceData } from '/src/core/service-protocol.ts';
import { experienceText } from '/src/core/experience-i18n.ts';
const locale=new URL(location.href).searchParams.get('locale')??'en'; document.documentElement.lang=locale;
const request=document.createElement('div'); request.className='ds-message'; request.innerHTML='<div class="ds-collapsible-text"></div>'; request.firstElementChild.textContent='[DeepRole Service]\n[Request ID: preview]\n[DeepRole Memory Analysis]\nAnalyze the conversation.';
const reply=document.createElement('div'); reply.className='ds-message'; reply.innerHTML='<div class="ds-think-content">Technical reasoning.</div><div class="ds-markdown ds-assistant-message-main-content"><p>Checking the story.</p><p>&lt;deeprole_data&gt;</p></div>';
document.querySelector('#conversation').append(request,reply);
const sync=()=>presentMemoryAnalysis('preview',experienceText(locale,'memoryPreloader'));
window.serviceTest={sync,finish:(fail=false)=>presentMemoryAnalysis('preview',experienceText(locale,'memoryPreloader'),experienceText(locale,fail?'memoryAnalysisFailed':'resultReview')),archive:()=>replaceArchivedMemoryPayloads(experienceText(locale,'memoryResultArchived')),parse:()=>findServiceResponseElements('preview').map(el=>parseServiceData(el.textContent)),reply};
sync();
</script></body></html>
