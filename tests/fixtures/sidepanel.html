<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepRole side panel preview</title>
    <style>html,body,#root{margin:0;min-height:100%;width:100%}body{background:#080b12}</style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const storageListeners = new Set();
      const runtimeListeners = new Set();
      const persistSettings = new URLSearchParams(location.search).has("persist");
      const makeArea = (initial = {}, persistentKey) => {
        const saved = persistSettings && persistentKey ? localStorage.getItem(persistentKey) : null;
        const values = new Map(Object.entries(saved ? JSON.parse(saved) : initial));
        return {
          get: async (keys) => {
            if (!keys) return Object.fromEntries(values);
            const list = Array.isArray(keys) ? keys : [keys];
            return Object.fromEntries(list.filter((key) => values.has(key)).map((key) => [key, values.get(key)]));
          },
          set: async (next) => { Object.entries(next).forEach(([key, value]) => values.set(key, value)); if (persistSettings && persistentKey) localStorage.setItem(persistentKey, JSON.stringify(Object.fromEntries(values))); storageListeners.forEach((listener) => listener()); },
          remove: async (keys) => { (Array.isArray(keys) ? keys : [keys]).forEach((key) => values.delete(key)); },
        };
      };
      window.chrome = {
        runtime: { id: "preview", sendMessage: async () => undefined, onMessage: { addListener(listener) { runtimeListeners.add(listener); }, removeListener(listener) { runtimeListeners.delete(listener); } } },
        storage: {
          local: makeArea({ deeprole_settings: { locale: "ru", onboardingComplete: true, contextBudget: 2000, relevanceThreshold: 6, suggestionInterval: 20, suggestionsEnabled: true, recentMessageCount: 4, animationsEnabled: true, confirmDeletions: true } }, "dr-preview-settings"),
          session: makeArea(),
          onChanged: { addListener(listener) { storageListeners.add(listener); }, removeListener(listener) { storageListeners.delete(listener); } },
        },
        tabs: { query: async () => [], sendMessage: async () => undefined },
      };
    </script>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { App } from "/src/entrypoints/sidepanel/App.tsx";
      import { repository } from "/src/storage/repository.ts";
      import "/src/entrypoints/sidepanel/styles.css";
      import "/src/entrypoints/shared/help.css";

      await repository.clear();
      const now = Date.now();
      await repository.put("book", { id: "book-1", name: "Лунный предел", description: "Основной сюжет", color: "#58a6ff", active: true, createdAt: now, updatedAt: now });
      await repository.put("entry", { id: "memory-1", bookId: "book-1", title: "Клятва Миры", content: "Мира поклялась не покидать город до рассвета.", keywords: ["Мира", "клятва", "город"], activation: "smart", priority: "high", enabled: true, source: { type: "manual" }, createdAt: now, updatedAt: now });
      await repository.put("entry", { id: "memory-2", bookId: null, title: "Стиль диалога", content: "Сохранять медленный темп и атмосферные описания.", keywords: ["стиль", "темп"], activation: "always", priority: "normal", enabled: true, source: { type: "manual" }, createdAt: now - 1, updatedAt: now - 1 });
      if (new URLSearchParams(location.search).has("world")) {
        for (const id of ["world-a", "world-b"]) await repository.put("world", { id, name: id === "world-a" ? "Observatory" : "Forest", description: "", color: "#58a6ff", contextBudget: 3000, relevanceThreshold: 6, createdAt: now, updatedAt: now });
        window.chrome.tabs.query = async () => [{ id: 1, url: "https://chat.deepseek.com/a/chat/test" }];
        let pageState = { type: "DR_PAGE_STATE", chatId: "test", chatUrl: "https://chat.deepseek.com/a/chat/test", messageCount: 2, status: { compatible: true }, scene: { worldId: "world-a", bookId: null, focusIds: [] }, selection: { entries: [], estimatedTokens: 0, omittedCount: 0 } };
        window.chrome.tabs.sendMessage = async () => pageState;
        window.setPageState = (patch) => { pageState = { ...pageState, ...patch }; runtimeListeners.forEach(listener => listener({ type: "DR_CONTEXT_CHANGED" })); };
      }
      if (new URLSearchParams(location.search).has("vault")) await repository.enableVault("session-password");
      createRoot(document.querySelector("#root")).render(React.createElement(App));
    </script>
  </body>
</html>
