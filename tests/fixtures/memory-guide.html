<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory guide shadow-root test</title></head><body style="margin:0;background:#181818"><main><h1 style="color:white">Memory guide test</h1><div id="host"></div></main><script type="module">
import React from "react";
import {createRoot} from "react-dom/client";
