<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character field queue fixture</title><style>body{margin:0;background:#181818;color:#eee;font:14px system-ui}#app{max-width:680px;margin:16px auto;padding:16px}button{font:inherit}.controls{position:fixed;bottom:0;left:0;z-index:2147483647;background:#222;padding:4px;display:flex;gap:4px;flex-wrap:wrap}.controls button{font-size:12px}</style></head><body><main id="app" class="dr-root"></main><nav class="controls" aria-label="Test controls"><button id="finish">Finish reply</button><button id="cleanup">Finish cleanup</button><button id="scope">Change book</button></nav>
<script>const area=()=>{const values=new Map();return{get:async key=>key?{[key]:values.get(key)}:Object.fromEntries(values),set:async v=>{for(const[k,val]of Object.entries(v))values.set(k,val);},remove:async keys=>(Array.isArray(keys)?keys:[keys]).forEach(k=>values.delete(k))}};window.chrome={runtime:{id:"fixture",sendMessage:async()=>{},onMessage:{addListener(){},removeListener(){}}},storage:{local:area(),session:area(),onChanged:{addListener(){},removeListener(){}}}};</script>
<script type="module">
import React,{useState}from"react";import{createRoot}from"react-dom/client";
import{CharacterEditor}from"/src/entrypoints/shared/CharacterSheets.tsx";
import{IsolatedFieldClient}from"/src/adapters/isolated-field-client.ts";

import{repository}from"/src/storage/repository.ts";import{castRecords}from"/tests/fixtures/cast-data.ts";
import{DEFAULT_SETTINGS}from"/src/core/defaults.ts";import{EMPTY_CHARACTER}from"/src/core/characters.ts";
import"/src/entrypoints/shared/design-system.css";import"/src/entrypoints/shared/characters.css";
const query=new URLSearchParams(location.search),locale=query.get("locale")??"en";document.documentElement.lang=locale;
const entity={id:"mira",worldId:"w",kind:"character",name:"Mira",description:"",aliases:[],memberIds:[],characterSheet:EMPTY_CHARACTER,createdAt:1,updatedAt:1};
await repository.clear();await repository.mergeRecords([...castRecords(),{kind:"entity",id:"mira",data:entity}]);
window.queueEvents=[];window.queueRequests=[];window.queueSaved=0;window.mainDraft="Unsent main chat draft";window.holdCleanup=false;
const tabs=new Map([[1,{id:1,url:"https://chat.deepseek.com/chat/s/game"}]]),workers=new Map();let nextTab=2,active;
const api={runtime:{id:"fixture"},storage:window.chrome.storage,tabs:{get:async id=>{if(!tabs.has(id))throw Error("missing");return tabs.get(id)},create:async value=>{const tab={id:nextTab++,...value};tabs.set(tab.id,tab);window.queueEvents.push("create:"+tab.id);return tab},update:async(id,value)=>{const tab={...tabs.get(id),...value};tabs.set(id,tab);setTimeout(()=>void claim(id),0);return tab},remove:async id=>{tabs.delete(id);window.queueEvents.push("remove:"+id)},sendMessage:async id=>{const worker=workers.get(id);if(worker){window.queueEvents.push("cancel:"+id);await clean(worker)}return{ok:true}}}};
api.windows={create:async value=>({id:nextTab+10,tabs:[await api.tabs.create({url:value.url,active:true})]})};
const coordinator=new IsolatedFieldCoordinator(repository,api,async()=>DEFAULT_SETTINGS),source={id:"fixture",tab:{id:1},frameId:0,url:tabs.get(1).url};
const sendWorker=(worker,action,extra={})=>coordinator.handle({type:"DR_FIELD_WORKER",action,id:worker.id,...extra},{id:"fixture",tab:{id:worker.tab},frameId:0,url:tabs.get(worker.tab)?.url});
async function claim(tab){const worker={tab,id:new URL(tabs.get(tab).url).searchParams.get("deeprole_field_job"),chatId:"owned-"+tab};workers.set(tab,worker);active=worker;const result=await sendWorker(worker,"claim");window.queueEvents.push("send:"+tab);worker.prompt=result.prompt;await sendWorker(worker,"sent");tabs.set(tab,{id:tab,url:"https://chat.deepseek.com/chat/s/"+worker.chatId});await sendWorker(worker,"bound",{chatId:worker.chatId});window.activeField=window.queueRequests.at(-1)?.field.key;}
async function clean(worker){if(window.holdCleanup){worker.waitingCleanup=true;return}if(worker.cleaned)return;worker.cleaned=true;await sendWorker(worker,"authorize-cleanup");tabs.set(worker.tab,{id:worker.tab,url:"https://chat.deepseek.com/"});await sendWorker(worker,"cleaned",{chatId:worker.chatId,ok:true});workers.delete(worker.tab);}
document.getElementById("finish").onclick=async()=>{const worker=active;if(!worker||worker.cleaned)return;const key=window.activeField;const result=await sendWorker(worker,"reply",{chatId:worker.chatId,raw:"Prepared "+key});if(!result.ok)await sendWorker(worker,"error",{error:result.error});await clean(worker)};
document.getElementById("cleanup").onclick=async()=>{window.holdCleanup=false;for(const worker of workers.values())if(worker.waitingCleanup)await clean(worker)};
const client=new IsolatedFieldClient(m=>coordinator.handle(m,source));
function App(){const[open,setOpen]=useState(true),[book,setBook]=useState("one");window.changeQueueBook=()=>setBook("two");return open?React.createElement(CharacterEditor,{locale,generationScope:book,entity:{id:"mira",worldId:"w",kind:"character",name:"Mira",description:"",aliases:[],memberIds:[],characterSheet:EMPTY_CHARACTER,createdAt:1,updatedAt:1},actions:["neutral"],onClose:()=>setOpen(false),onSave:async()=>{window.queueSaved++;throw Error("do-not-save")},onGenerateText:async(draft,options)=>{window.queueRequests.push(draft);return client.generate({scope:{chatId:"game",chatUrl:source.url,worldId:"w",bookId:null},locale,draft,sceneReference:"Mira waits by the gate."},()=>true,options?.signal)}}):React.createElement("p",null,"Editor closed")}
document.getElementById("scope").onclick=()=>window.changeQueueBook();createRoot(document.getElementById("app")).render(React.createElement(App));
</script></body></html>
