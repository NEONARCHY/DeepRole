<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepRole playable story fixture</title></head><body>
<main class="app-shell" style="min-height:100vh;padding:12px"><h1 style="font-size:20px;margin:0 0 16px">DeepRole</h1><div id="story"></div></main>
<script type="module">
import React from "react"; import { createRoot } from "react-dom/client";
import { StoryReview } from "/src/entrypoints/shared/StoryReview.tsx";
import { storyReviewPage, storyReviewPreview } from "/tests/fixtures/story-review.ts";
import "/src/entrypoints/sidepanel/styles.css";
const locale = new URL(location.href).searchParams.get("locale") === "ru" ? "ru" : "en"; document.documentElement.lang = locale;
const fixture = { calls: [], managed: false, paused: false, nextOutOfCharacter: false, mode: "normal" }; window.storyGameFixture = fixture;
createRoot(document.querySelector("#story")).render(React.createElement(StoryReview, { locale,
  onRead: async () => { const p = storyReviewPage(locale); return { ...p, next: null, managed: fixture.managed, paused: fixture.paused, nextOutOfCharacter: fixture.nextOutOfCharacter, guard: { ...p.guard, headRevisionId: fixture.managed ? "review-assistant" : null, revisionCount: 2 } }; },
  onGame: async (operation, manual) => { fixture.calls.push({ operation, manual }); if (fixture.mode === "conflict" && manual !== "keep") throw Error("story-manual-conflict"); fixture.managed = true; fixture.paused = operation === "undo"; if (operation === "out-of-character") fixture.nextOutOfCharacter = !fixture.nextOutOfCharacter; },
  onPreview: async (_, head) => storyReviewPreview(locale, head),
}));
</script></body></html>
