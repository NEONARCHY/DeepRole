const stores={local:new Map(),session:new Map()};const area=name=>({get:async keys=>{const names=keys?Array.isArray(keys)?keys:[keys]:[...stores[name].keys()];return Object.fromEntries(names.filter(k=>stores[name].has(k)).map(k=>[k,stores[name].get(k)]));},set:async values=>Object.entries(values).forEach(([k,v])=>stores[name].set(k,v)),remove:async key=>stores[name].delete(key)});
window.chrome={runtime:{id:"fixture",sendMessage:async()=>{},onMessage:{addListener(){},removeListener(){}}},storage:{local:area("local"),session:area("session"),onChanged:{addListener(){},removeListener(){}}},permissions:{contains:async()=>true}};
</script><script type="module">
import{IllustrationsPresenter}from"/src/adapters/illustrations-dom.tsx";import{ImageJobs}from"/src/storage/image-jobs.ts";import{repository}from"/src/storage/repository.ts";import{saveImageSettings}from"/src/storage/image-settings.ts";import{saveProviderKey}from"/src/storage/image-keys.ts";import{DEFAULT_IMAGE_SETTINGS}from"/src/core/image-generation.ts";import{EMPTY_CHARACTER}from"/src/core/characters.ts";import{selfieImageKey}from"/src/core/selfies.ts";import{imagePlanInstruction,imagePlanRoster}from"/src/core/image-plan.ts";
const params=new URL(location.href).searchParams,locale=params.get("locale")??"en",limit=Number(params.get("limit")??6);document.documentElement.lang=locale;
const world={id:"group-world",name:"Observatory",description:"Unchanged neutral lore",color:"blue",contextBudget:2000,relevanceThreshold:6,createdAt:1,updatedAt:1};
const entities=["Mira","Noah","Ari","Dani","Iris","Leo"].map((name,index)=>{const canvas=document.createElement("canvas");canvas.width=512;canvas.height=768;const ctx=canvas.getContext("2d");ctx.fillStyle=["#657b8b","#7b656b","#7a8960","#616389","#846f51","#506c82"][index];ctx.fillRect(0,0,512,768);const reference=canvas.toDataURL();return{id:"person-"+index,name,worldId:world.id,kind:"character",description:"A fictional adult astronomer.",aliases:[],memberIds:[],createdAt:1,updatedAt:1,characterSheet:{...EMPTY_CHARACTER,portraitLibrary:[reference],imageGeneration:{canonical:"Distinctive coat "+index,sceneDelta:"",prefix:"",suffix:"",format:"prose",referenceKey:selfieImageKey(reference)}}};});
const config={id:"11111111-1111-4111-8111-111111111111",label:"Synthetic group connection",kind:"venice-native",baseUrl:"https://images.example.test/v1",modelId:"synthetic-image-model",editModelId:"synthetic-edit-model",maxReferences:limit,enabled:true,extraParams:{futureOption:{keep:[false,null,3]}}};
const settings={...DEFAULT_IMAGE_SETTINGS,enabled:true,profiles:[config],profileByLevel:{off:config.id}};await saveImageSettings(settings);await saveProviderKey(config.id,"SYNTHETIC-GROUP-KEY");
if(!await repository.get("world",world.id)){await repository.put("world",world);for(const entity of entities)await repository.put("entity",entity);await repository.put("binding",{id:"binding:group-chat",chatId:"group-chat",chatUrl:"https://chat.deepseek.com/a/chat/s/group-chat",worldId:world.id,bookId:null,messageCountAtAnalysis:0,createdAt:1,updatedAt:1});}
const jobs=new ImageJobs(repository,async()=>true),presenter=new IllustrationsPresenter();window.sentPlans=[];
const plan={scene:"Six adult astronomers gather around a star chart at the observatory, with Noah in conversational focus.",characters:entities.map((p,i)=>({id:p.id,reference:"neutral",appearance:"A wool coat.",action:i===1?"Talking to Mira":"Studying chart "+i,position:"Around the table at position "+i,focus:i===1?"primary":"background"}))};
async function sync(){const binding=await repository.get("binding","binding:group-chat");presenter.sync({enabled:true,generating:false,worldId:world.id,chatId:"group-chat",chatUrl:binding.chatUrl,records:await repository.list("illustration"),attempts:binding.illustrationAttempts??[],entities:await repository.list("entity"),settings,locale,actions:{onCreate:async(target,text)=>{const{ id }=await jobs.start(target);window.sentPlans.push(imagePlanInstruction({name:"Group frame",completedScene:text,roster:imagePlanRoster(entities),referenceBudget:limit}));await sync();try{await jobs.render(target,id,plan);}finally{await sync();}},onRepeat:async(target,id,attempt)=>{await jobs.repeat(target,id,attempt);await sync();},onRemove:async(target,id)=>{await jobs.remove(target,id);await sync();},onDownload:async()=>{}}});}await sync();
</script></body></html>
