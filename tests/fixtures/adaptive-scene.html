<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Adaptive scene</title><style>body{margin:0;background:#10151e;color:#f0f0f2;font:15px/1.6 system-ui}main{max-width:720px;margin:140px auto;padding:16px}article{margin:16px 0}h1{position:fixed;top:8px;left:8px;font-size:15px;margin:0}textarea{width:100%;box-sizing:border-box;min-height:90px;background:#18283e;color:#eee;border:1px solid #456;border-radius:12px}</style></head><body><h1>Observatory</h1><div id="app"></div><main><article data-role="assistant"><div class="ds-markdown" id="reply"></div></article><textarea aria-label="Message"></textarea><div style="height:1200px"></div></main><script type="module">
import React,{useState,useEffect} from "react";import{createRoot}from"react-dom/client";
import{PageWidget}from"/src/entrypoints/content/PageWidget.tsx";
import{syncSceneChoiceCards}from"/src/adapters/deepseek-choices-dom.ts";
import{syncChoicePortraits}from"/src/adapters/deepseek-characters-dom.ts";
import{EMPTY_CHARACTER,EMPTY_STATUS}from"/src/core/characters.ts";
import"/src/entrypoints/content/page-widget.css";import"/src/entrypoints/shared/scene.css";import"/src/entrypoints/shared/help.css";
const params=new URLSearchParams(location.search);const locale=params.get("locale")??"en";document.documentElement.lang=locale;
const entities=Array.from({length:params.has("crowded")?40:4},(_,i)=>({id:String(i),name:["Noah","Mira","Leon","Iris"][i]??`Guest ${i}`,kind:"character",worldId:"w",description:"",aliases:[],memberIds:[],createdAt:1,updatedAt:1,characterSheet:{...EMPTY_CHARACTER,protagonist:i===0,sprites:{}}}));
const scene={revision:"1",presentIds:entities.map(p=>p.id),partnerIds:["1","2"],states:Object.fromEntries(entities.map(p=>[p.id,{...EMPTY_STATUS,emotion:"neutral",stats:[{label:"Energy",value:"Rested"}]}])),updatedAt:1};
if(params.has("resize")){const canvas=document.createElement("canvas");canvas.width=120;canvas.height=160;const paint=canvas.getContext("2d");paint.fillStyle="#628596";paint.fillRect(0,0,120,160);paint.fillStyle="#bdd9e2";paint.beginPath();paint.arc(60,55,24,0,Math.PI*2);paint.fill();paint.fillRect(28,88,64,62);const portrait=canvas.toDataURL("image/png");for(const entity of entities)entity.characterSheet={...entity.characterSheet,sprites:{neutral:portrait}};}
window.getCastSnapshot=()=>JSON.parse(JSON.stringify({entities,scene}));
const options=["positive","neutral","negative","surprise"].map((kind,i)=>({kind,label:["Thank Mira","Ask about the letter","Refuse to take it","Offer a trade"][i],text:"I hold the sealed envelope and wait for a reply."}));
document.querySelector("#reply").textContent="Mira holds a sealed envelope. What will you do?\n<deeprole_choices>"+JSON.stringify({version:1,options})+"</deeprole_choices>";
const noop=()=>{};
function App(){const[adaptive,setAdaptive]=useState(true);const[pins,setPins]=useState({pinSceneChoices:params.has("pinned"),pinPortraits:false});const[layout,setLayout]=useState({positions:{},minimized:[],together:false});
window.setAdaptive=setAdaptive;window.setPortraitPins=value=>setPins(old=>({...old,pinPortraits:value}));window.getSavedLayouts=()=>({widgets:layout,portraits:localStorage.getItem("poses")});
useEffect(()=>{const sync=()=>{syncSceneChoiceCards(true,false,locale,async()=>true,document,undefined,{...pins,adaptiveLayout:adaptive,onToggle:key=>setPins(old=>({...old,[key]:!old[key]}))});syncChoicePortraits(true,entities,scene,locale,noop,document,{scope:"adaptive",adaptiveLayout:adaptive,pinSceneChoices:pins.pinSceneChoices,pinLeft:pins.pinPortraits,pinRight:pins.pinPortraits,layout:JSON.parse(localStorage.getItem("poses")??"null"),onSave:async(id,pose)=>{if(window.rejectPortraitLayout)throw Error("offline");if(window.delayPortraitLayout)await new Promise(resolve=>setTimeout(resolve,window.delayPortraitLayout));const saved=JSON.parse(localStorage.getItem("poses")??'{"resetAt":0,"positions":{}}');if(id)saved.positions[id]=pose;else saved.positions={};localStorage.setItem("poses",JSON.stringify(saved));sync();}});};sync();const timer=setInterval(sync,250);return()=>clearInterval(timer);},[adaptive,pins]);
const state={pageReady:true,vaultLocked:false,locale,adaptiveLayout:adaptive,characterSpritesEnabled:true,contextPosition:{x:8,y:42},widgetLayout:layout,selection:{entries:[],estimatedTokens:0,omittedCount:0},warning:"",contextText:"",selectionText:"",selectionPosition:null,analysisSuggested:false,handoffOffer:null,toast:"",availableEntries:[],conversationEstimate:{estimatedTokens:5000,messageCount:10,source:"history",atLeast:false},scene:{worldId:"w",bookId:null,focusIds:[]},sceneChoicesEnabled:true,worlds:[{id:"w",name:"Observatory",description:"",color:"#888888",contextBudget:2000,relevanceThreshold:6,createdAt:1,updatedAt:1}],characters:{worldId:"w",chatId:"a",base:"1",status:"updated",emotions:["neutral"],entities,scene}};
return React.createElement(PageWidget,{state,onToggleAdaptiveLayout:()=>setAdaptive(!adaptive),onTogglePortraits:noop,onWidgetLayoutChange:async next=>setLayout(next),onSaveCharacter:async()=>{},onSceneChange:noop,onSceneChoicesToggle:noop,onToggleEntry:noop,onAttachEntry:noop,onCopyContext:noop,onAnalyze:noop,onDismissSuggestion:noop,onSaveSelection:noop,onApplyHandoff:noop,onDismissHandoff:noop,onContextPositionChange:noop,menuUrl:"/tests/fixtures/sidepanel.html"});}
createRoot(document.querySelector("#app")).render(React.createElement(App));
</script></body></html>
