<!doctype html>
<html lang="ru">
  <head><meta charset="UTF-8"><title>DeepRole context indicator</title><style>body{min-height:700px;margin:0;background:#181818}</style></head>
  <body>
    <button id="underlying-chat-control" aria-label="DeepSeek chat control" style="position:fixed;left:clamp(270px,50vw,600px);top:140px;width:32px;height:32px;z-index:1" onclick="document.body.dataset.chatControlClicked='true'">Chat</button>
    <div id="root"></div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { PageWidget } from "/src/entrypoints/content/PageWidget.tsx";
      import {parseWidgetLayout,WIDGET_LAYOUT_KEY} from "/src/entrypoints/content/WidgetDeck.tsx";
      import "/src/entrypoints/shared/memory-assistant.css";
      import "/src/entrypoints/shared/scene.css";
      import "/src/entrypoints/content/page-widget.css";
      import "/src/entrypoints/shared/help.css";
      const entry = { id: "m1", bookId: null, title: "Клятва Миры", content: "Мира останется в городе до рассвета.", keywords: ["Мира"], activation: "smart", priority: "high", enabled: true, source: { type: "manual" }, createdAt: 1, updatedAt: 1 };
      const state = { pageReady: true, vaultLocked: false, locale: "ru", showChatContextMeter: true, showMemoryContextIndicator: true, characterSpritesEnabled: true, selection: { entries: [{ entry, score: 12, reasons: ["keyword"], estimatedTokens: 20, manuallySelected: false }], estimatedTokens: 20, omittedCount: 0 }, warning: "", contextText: "memory", selectionText: "", selectionPosition: null, contextPosition: { x: 210, y: 52 }, analysisSuggested: true, handoffOffer: null, toast: "", availableEntries: [] };
      if (new URLSearchParams(location.search).get("locale") === "en") state.locale = "en";
      state.floatingPanelWidth=Number(localStorage.getItem("fixture-panel-width"))||224;
      state.widgetLayout=parseWidgetLayout(JSON.parse(localStorage.getItem(WIDGET_LAYOUT_KEY)??"null"));
      if(new URLSearchParams(location.search).has("panels")){
        state.analysisSuggested=false;state.contextPosition={x:16,y:24};
        state.conversationEstimate={estimatedTokens:5000,messageCount:10,source:"history",atLeast:false};
        state.worlds=[{id:"w",name:"Observatory",description:"",color:"#888888",contextBudget:2000,relevanceThreshold:6,createdAt:1,updatedAt:1}];
        state.scene={worldId:"w",bookId:null,focusIds:[]};state.sceneChoicesEnabled=true;
        state.characters={worldId:"w",chatId:"a",base:"1",status:"updated",emotions:["neutral"],entities:[{id:"mira",name:"Mira",kind:"character",worldId:"w",description:"",aliases:[],memberIds:[],createdAt:1,updatedAt:1}],scene:{revision:"1",presentIds:["mira"],states:{mira:{emotion:"neutral",condition:"Safe",goal:"Find the key",relationship:"Trusts Noah",stats:[]}},updatedAt:1}};
      }
      if (new URLSearchParams(location.search).has("assistant")) state.proposals = [{ id: "batch", worldId: null, bookId: null, chatId: "chat", focusIds: [], requestType: "memory-analysis", createdAt: 1, updatedAt: 1, items: [{ id: "c", title: "Mira's oath", content: "The promise now expires at noon.", keywords: [], activation: "smart", priority: "normal", bookId: null, selected: true, targetEntryId: entry.id, expectedEntry: entry }] }];
      const noop = () => {};
      if (new URLSearchParams(location.search).has("native-sidebar")) {
        state.adaptiveLayout=new URLSearchParams(location.search).has("adaptive");
        const style=document.createElement("style");style.textContent=".native-sidebar{position:fixed;inset:0 auto 0 0;width:264px;background:#242424;transition:transform .4s ease}.native-sidebar h2{margin:22px 16px;color:#648cff}.native-sidebar a{display:block;padding:14px;color:#ddd}.native-chat-title{position:fixed;top:18px;left:280px;height:28px;font:600 16px system-ui;color:#eee;transition:left .4s ease}.native-composer{position:fixed;bottom:20px;left:520px;width:500px;height:80px;transition:left .4s ease}.sidebar-closed .native-sidebar{transform:translateX(-264px)}.sidebar-closed .native-chat-title{left:194px}.sidebar-closed .native-composer{left:380px}@media(max-width:1000px){.native-composer{left:300px;width:calc(100vw - 320px)}.sidebar-closed .native-composer{left:20px;width:calc(100vw - 40px)}}@media(prefers-reduced-motion:reduce){.native-sidebar,.native-chat-title,.native-composer{transition:none}}";document.head.append(style);
        const sidebar=document.createElement("aside");sidebar.className="native-sidebar";sidebar.innerHTML='<h2>deepseek</h2><a href="/chat/s/fixture">Observatory</a>';document.body.append(sidebar);
        const title=document.createElement("h1");title.className="native-chat-title";title.textContent=state.locale==="ru"?"История":"Story";document.body.append(title);
        const composer=document.createElement("textarea");composer.className="native-composer";composer.setAttribute("aria-label","Native message");document.body.append(composer);
        document.body.classList.toggle("sidebar-closed",localStorage.getItem("fixture-sidebar-closed")==="true");
        window.toggleNativeSidebar=()=>{document.body.classList.toggle("sidebar-closed");localStorage.setItem("fixture-sidebar-closed",String(document.body.classList.contains("sidebar-closed")));};
      }
      const root = createRoot(document.querySelector("#root"));
      const render = () => root.render(React.createElement(PageWidget, { state: { ...state }, onPanelWidthChange:async width=>{if(window.rejectWidth)throw Error("offline");state.floatingPanelWidth=width;localStorage.setItem("fixture-panel-width",String(width));render();}, onSaveCharacter:async edit=>{window.savedCharacter=edit;return{entityId:edit.entityId??"fixture-character",base:"saved",original:{...edit.original,name:edit.name,sheet:edit.sheet,state:edit.state,present:edit.present,interlocutor:edit.interlocutor??edit.original.interlocutor}};}, onSceneChange:noop, onSceneChoicesToggle:noop, onTogglePortraits:()=>{state.characterSpritesEnabled=!state.characterSpritesEnabled;window.portraitsVisible=state.characterSpritesEnabled;render();}, onWidgetLayoutChange:async layout=>{if(window.rejectLayout)throw Error("offline");state.widgetLayout=layout;window.savedWidgetLayout=layout;localStorage.setItem(WIDGET_LAYOUT_KEY,JSON.stringify(layout));render();}, onToggleEntry: noop, onAttachEntry: noop, onCopyContext: noop, onAnalyze: noop, onDismissSuggestion: noop, onSaveSelection: noop, onApplyHandoff: noop, onDismissHandoff: noop, onContextPositionChange: (position) => { window.lastContextPosition = position; }, onQuickSave: async (text, mode, title) => { window.savedMemory = { text, mode, title }; }, onDraftLore: async (brief) => { window.loreBrief = brief; }, onReview: async (batch, items) => { window.reviewed = items; }, onDiscard: async () => { window.discarded = true; }, menuUrl: "/tests/fixtures/sidepanel.html?embedded=1" + (new URLSearchParams(location.search).has("world") ? "&world=1" : "") }));
      window.setWidgetState = (patch) => { Object.assign(state, patch); render(); };
      render();
    </script>
  </body>
</html>
