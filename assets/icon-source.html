<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      body { display: grid; place-items: center; }
      .icon { position: relative; width: 84%; height: 84%; border-radius: 28%; background: linear-gradient(145deg, #152536, #070b12 68%); box-shadow: inset 0 0 0 1.5vmin rgba(119,196,255,.42), 0 7vmin 15vmin rgba(0,0,0,.35); }
      .ring, .ring::before, .ring::after { position: absolute; border-radius: 50%; }
      .ring { inset: 19%; border: 2.2vmin solid rgba(107,190,255,.42); box-shadow: inset 0 0 10vmin rgba(54,157,255,.2), 0 0 8vmin rgba(69,160,255,.18); transform: rotate(-28deg); border-top-color: #7cc7ff; }
      .ring::before { content: ""; inset: 15%; border: 1.6vmin solid rgba(126,137,255,.55); border-left-color: #9ed9ff; transform: rotate(66deg); }
      .ring::after { content: ""; inset: 31%; background: radial-gradient(circle, #e7f7ff 0 13%, #70c2ff 20% 38%, rgba(79,157,255,.22) 52%, transparent 70%); box-shadow: 0 0 10vmin #4d9dff; }
      .spark { position: absolute; width: 4.5%; height: 4.5%; left: 72%; top: 22%; border-radius: 50%; background: #b9e9ff; box-shadow: 0 0 5vmin #61b8ff; }
    </style>
  </head>
  <body><div class="icon"><div class="ring"></div><div class="spark"></div></div></body>
</html>
