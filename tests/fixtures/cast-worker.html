<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>DeepRole roster service fixture</title></head><body><nav id="sidebar"><div id="foreign-row"><a href="/chat/s/personal">Personal chat</a><button aria-label="More">...</button></div></nav><main id="turns"></main><form><textarea aria-label="Message"></textarea><button type="submit">Send</button><button type="button" data-testid="stop-generation" hidden>Stop</button></form>
<script>const area=()=>{const values=new Map();return{get:async()=>Object.fromEntries(values),set:async v=>{for(const[k,val]of Object.entries(v))values.set(k,val);},remove:async()=>{}}};window.workerListeners=[];window.chrome={runtime:{id:"fixture",sendMessage:async()=>{},onMessage:{addListener(fn){window.workerListeners.push(fn);},removeListener(){}}},storage:{local:area(),session:area(),onChanged:{addListener(){},removeListener(){}}}};</script>
<script type="module">
import { startCastWorker } from "/src/adapters/cast-worker.ts";
import { createCastJob, mutateCastJob, acceptCastReply } from "/src/storage/cast-initialization.ts";
import { castPrompt } from "/src/core/cast-initialization.ts";
import { repository } from "/src/storage/repository.ts";
import { castRecords, castDraft } from "/tests/fixtures/cast-data.ts";
import { bootstrapCastServiceScreen, bootstrapFieldServiceScreen } from "/src/adapters/field-service-screen.ts";
const qs=new URLSearchParams(location.search),scenario=qs.get("scenario")??"full",locale=qs.get("locale")==="ru"?"ru":"en";
document.documentElement.lang=locale;
history.replaceState({}, "", "/");
await repository.clear();await repository.mergeRecords(castRecords());
const job=await createCastJob("w",locale,false,repository), id=job.id;
history.replaceState({},"","/?deeprole_cast_job="+id+"&deeprole_cast_locale="+locale);
window.fieldMask=!!bootstrapFieldServiceScreen();bootstrapCastServiceScreen();
window.sentPrompts=[];window.workerFinished=false;window.cleanupCount=0;window.cleanedOk=null;window.foreignClicks=0;
document.querySelector('#foreign-row button').onclick=()=>window.foreignClicks++;
window.chrome.runtime.sendMessage=async message=>{
 const j=await repository.get("cast",id);
 if(message.action==="claim")return {ok:true,...j,prompt:castPrompt(j),replyCheckpoint:j.replyCheckpoint};
 if(message.action==="sent")await mutateCastJob(id,v=>({...v,awaiting:true,phase:message.step===0?"reading":"analyzing",replyCheckpoint:undefined}));
 if(message.action==="sent"&&scenario==="cancel-before-send")setTimeout(async()=>{await mutateCastJob(id,v=>({...v,phase:"cancelled",awaiting:false}));for(const listener of window.workerListeners)listener({type:"DR_CAST_RETRY_CLEANUP"});},30);
 if(message.action==="sent"&&scenario==="navigate-before-send")setTimeout(()=>history.replaceState({},"","/chat/s/personal"),30);
 if(message.action==="authorize-cleanup")return {ok:true,chatId:j.chatId};
 if(message.action==="bound")await mutateCastJob(id,v=>({...v,chatId:"owned"}));
 if(message.action==="checkpoint")await mutateCastJob(id,v=>({...v,replyCheckpoint:{...message}}));
 if(message.action==="reply")await acceptCastReply(id,message.step,message.raw);
 if(message.type==="DR_CAST"&&message.action==="cancel")await mutateCastJob(id,v=>({...v,phase:"cancelled",awaiting:false}));
 if(message.action==="error")await mutateCastJob(id,v=>["opening","reading","analyzing"].includes(v.phase)?({...v,phase:"error",error:message.error}):v);
 if(message.action==="cleaned"){window.workerFinished=true;window.cleanedOk=message.ok;await mutateCastJob(id,v=>({...v,cleanup:message.ok?"done":"failed"}));}
 return {ok:true};
};
window.workerSnapshot=()=>repository.get("cast",id);
const form=document.querySelector("form"),composer=document.querySelector("textarea"),stop=document.querySelector("[data-testid=stop-generation]"),turns=document.getElementById("turns");
stop.onclick=()=>stop.hidden=true;
function ownedSidebar(){
 if(document.querySelector("#owned-row"))return;
 const row=document.createElement("div");row.id="owned-row";row.innerHTML='<a href="https://chat.deepseek.com/chat/s/owned">Owned service chat</a><button aria-label="More">...</button>';document.querySelector("#sidebar").append(row);
 row.querySelector("button").onclick=()=>{if(scenario==="cleanup-fail")return;const menu=document.createElement("div");menu.setAttribute("role","menu");menu.innerHTML='<button role="menuitem">Delete</button>';document.body.append(menu);menu.querySelector("button").onclick=()=>{
  menu.remove();const dialog=document.createElement(qs.get("nativeDialog")==="1"?"dialog":"div");dialog.setAttribute("role","dialog");dialog.innerHTML='Delete chat?<button>Delete</button>';document.body.append(dialog);if(dialog instanceof HTMLDialogElement)dialog.showModal();dialog.querySelector("button").onclick=()=>{window.cleanupCount++;row.remove();dialog.remove();history.replaceState({},"","/");};
 };};
}
form.addEventListener("submit",e=>{
 e.preventDefault();const prompt=composer.value;composer.value="";window.sentPrompts.push(prompt);
 history.replaceState({}, "", "/chat/s/owned");
 ownedSidebar();
 const u=document.createElement("article");u.dataset.messageRole="user";u.textContent=prompt;
 const a=document.createElement("article");a.dataset.messageRole="assistant";a.dataset.messageId="reply-"+window.sentPrompts.length;
 const think=document.createElement("div");think.className="ds-think-content";think.textContent="Synthetic reasoning excluded from profiles.";
 const body=document.createElement("div");body.className="ds-assistant-message-main-content";a.append(think,body);turns.append(u,a);stop.hidden=false;
 setTimeout(()=>{
  if(window.sentPrompts.length===1){body.textContent="received";stop.hidden=true;return;}
  const draft=castDraft(id),index=window.sentPrompts.length===2||scenario==="repair"&&window.sentPrompts.length===3?0:1,member=draft.characters[index];
  if(scenario==="partial"){
   body.textContent='<deeprole_cast>{"version":1,"request":"'+id+'","characters":['+JSON.stringify(member)+',{"key":"unfinished","sheet":';
   setTimeout(()=>{body.textContent="Sorry, that's beyond my current scope. Let's talk about something else.";stop.hidden=true;},200);
  }else{
   const batch={...draft,characters:[member],present:index===1?["p1",member.key]:[member.key],partners:index===1?[member.key]:[],more:index===0};
   if(scenario==="repair"&&window.sentPrompts.length===2)batch.characters[0].evidence[0].quote="INVALID_PRIVATE_QUOTE";
   body.textContent="<deeprole_cast>"+JSON.stringify(batch)+"</deeprole_cast>";
   stop.hidden=true;
  }
 },scenario==="hold"?5000:scenario==="repair"?1200:200);
});
await startCastWorker();
</script></body></html>
