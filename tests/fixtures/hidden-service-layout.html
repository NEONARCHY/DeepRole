<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hidden service layout</title>
<style>html,body{margin:0;background:#13171b;color:#e4edf3;font:14px/1.6 system-ui}header{padding:12px}#scroll{height:calc(100vh - 180px);overflow-y:auto}#chat{max-width:720px;margin:auto;padding:12px}.turn{margin-block:24px;padding-block:20px;min-height:170px}.toolbar{display:flex;gap:8px;margin-top:16px}button{padding:8px;border:1px solid #414f5b;background:#27323b;color:inherit;border-radius:8px}.ds-think-content{padding:12px;border-left:1px solid #414f5b;color:#829baa}.image{height:120px;display:grid;place-items:center;margin-top:10px;background:#22313b;border-radius:12px}form{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(720px,calc(100vw - 24px));box-sizing:border-box;padding:12px;background:#293038;border-radius:16px}textarea{box-sizing:border-box;width:100%;color:inherit;background:transparent;border:0;resize:none}</style>
</head><body><header>DeepRole · Observatory</header><div id="scroll"><section id="chat">
<div class="turn" data-virtual-list-item-key="story" id="story-shell"><article data-role="assistant" data-message-id="story" id="story"><div class="ds-markdown">Mira opens the observatory at dusk. The telescope catches the first stars.</div><div data-deeprole-illustrations="true"><button id="image-action">Create illustration</button><div class="image">An observatory at dusk</div></div></article><div class="toolbar"><button>Copy</button><button>Share</button></div></div>
<div class="turn" data-virtual-list-item-key="image-command" id="image-command-shell"><div class="ds-message ds-message--user" id="image-command"><div class="ds-collapsible-text"></div></div><div class="toolbar"><button>Copy</button><button>Edit</button></div></div>
<div class="turn" data-virtual-list-item-key="image-reply" id="image-reply-shell"><div class="ds-message" id="image-reply"><button>Thought for 2 seconds</button><div class="ds-think-content">Private service reasoning.</div><div class="ds-assistant-message-main-content"></div></div><div class="toolbar"><button>Copy</button><button>Share</button></div></div>
<div class="turn" data-virtual-list-item-key="choice-command" id="choice-command-shell"><div class="ds-message ds-message--user" id="choice-command"><div class="ds-collapsible-text"></div></div><div class="toolbar"><button>Copy</button><button>Edit</button></div></div>
<div class="turn" data-virtual-list-item-key="choice-reply" id="choice-reply-shell"><div class="ds-message" id="choice-reply"><button>Thought for 2 seconds</button><div class="ds-think-content">Prepare four options without advancing the story.</div><div class="ds-markdown"></div></div><div class="toolbar" id="choice-toolbar"><button>Copy</button><button>Share</button></div></div>
</section></div><form><textarea aria-label="Message">Keep this unsent draft.</textarea><button type="button">Send</button></form>
<script type="module">
import { hideCharacterTextServices } from "/src/adapters/deepseek-service-dom.ts";
import { syncSceneChoiceCards } from "/src/adapters/deepseek-choices-dom.ts";
const params=new URL(location.href).searchParams,locale=params.get("locale")??"en",state={pinSceneChoices:params.has("pinned"),pinPortraits:false};
document.documentElement.lang=locale; document.querySelector("#image-action").textContent=locale==="ru"?"Создать иллюстрацию":"Create illustration";
document.querySelector("#image-command .ds-collapsible-text").textContent="[DeepRole Service]\n[Request ID: frame]\n[DeepRole Image Plan]\nDescribe the observatory.";
document.querySelector("#image-reply .ds-assistant-message-main-content").textContent='{"scene":"An observatory at dusk.","characters":[]}';
document.querySelector("#choice-command .ds-collapsible-text").textContent="[DeepRole Service]\n[Request ID: options]\n[DeepRole Scene Choices]\nSuggest four replies.";
const options=["positive","neutral","negative","surprise"].map((kind,i)=>({kind,label:(locale==="ru"?["Поблагодарить Миру","Спросить о звёздах","Остаться рядом","Исследовать купол"]:["Thank Mira","Ask about the stars","Stay nearby","Explore the dome"])[i],text:locale==="ru"?"Я спрашиваю о звёздах.":"I ask about the stars."}));
document.querySelector("#choice-reply .ds-markdown").textContent="<deeprole_choices>"+JSON.stringify({version:1,options})+"</deeprole_choices>";
const originals=Object.fromEntries(["image-command-shell","image-reply-shell","choice-command-shell","choice-reply-shell"].map(id=>[id,document.getElementById(id).outerHTML]));
window.imageClicks=0;document.getElementById("image-action").onclick=()=>window.imageClicks++;
function sync(){hideCharacterTextServices();syncSceneChoiceCards(true,false,locale,async choice=>{document.querySelector("textarea").value=choice.text;return true;},document,undefined,{...state,adaptiveLayout:true,onToggle:key=>{state[key]=!state[key];sync();}});}
window.layoutTest={sync,replace:()=>{for(const [id,html] of Object.entries(originals))document.getElementById(id).outerHTML=html;sync();},reuse:()=>{document.querySelector("#image-command .ds-collapsible-text").textContent="Mira, where is the key?";document.querySelector("#image-reply .ds-assistant-message-main-content").textContent="Mira points toward the telescope.";document.querySelector("#choice-command .ds-collapsible-text").textContent="Let us continue exploring.";sync();},prose:()=>{const p=document.createElement("p");p.textContent="Mira returns to the telescope.";document.querySelector("#choice-reply .ds-markdown").prepend(p);sync();}};
sync();
</script></body></html>
