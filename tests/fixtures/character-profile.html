<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Single profile test</title><style>body{margin:0;background:#181818;color:#eee;font:14px system-ui}h1{font-size:18px}</style></head><body><h1>Single profile test</h1><div id="app" class="dr-root"></div><script src="/tests/fixtures/portrait-storage.js"></script><script type="module">
import React from "react"; import {createRoot} from "react-dom/client";
import {CharacterEditor} from "/src/entrypoints/shared/CharacterSheets.tsx";
import {EMPTY_CHARACTER,EMPTY_STATUS} from "/src/core/characters.ts";
import {PROFILE_FIELDS} from "/src/core/character-profile.ts";
import {characterEditBaseline} from "/src/core/character-edit.ts";
import "/src/entrypoints/shared/design-system.css"; import "/src/entrypoints/shared/characters.css";
const params=new URL(location.href).searchParams,locale=params.get("locale")??"en";document.documentElement.lang=locale;
const existing=params.has("existing"),name=locale==="ru"?"Нора":"Nora",entity=existing?{id:"nora",name,worldId:"w",kind:"character",description:"",aliases:[],memberIds:[],characterSheet:{...EMPTY_CHARACTER,appearance:"Kept manual coat"},createdAt:1,updatedAt:1}:null;
window.requests=[];window.profileClosed=false;
const respond=request=>JSON.stringify(Object.fromEntries(request.field.profileFields.map(key=>[key,request.field.mode==="history"?key==="appearance"&&params.get("scenario")!=="unknown"?{status:"found",text:locale==="ru"?"Синий плащ.":"Blue coat.",evidence:[locale==="ru"?"Нора носит синий плащ.":"Nora wears a blue coat."]}:{status:"not-found",text:"",evidence:[]}:{status:"suggested",text:(locale==="ru"?"Новое описание ":"New description ")+key,evidence:[]}])));
createRoot(document.querySelector("#app")).render(React.createElement(CharacterEditor,{locale,entity,actions:["neutral"],onClose:()=>{window.profileClosed=true;},onGenerateText:async request=>{
window.requests.push(request);if(window.hold)return new Promise((resolve,reject)=>{window.finish=()=>resolve(respond(request));window.fail=()=>reject(Error("cancelled"));});
return {text:respond(request),cleanup:window.cleanupFailed?"failed":"done",partialContext:true,mode:request.field.mode,historyOrigin:"native",...(window.cleanupFailed?{cleanupUrl:"https://chat.deepseek.com/chat/s/owned"}:{})};},
onSave:async edit=>{window.saved=edit;const person={...(entity??{id:"new",worldId:"w",kind:"character",description:"",aliases:[],memberIds:[],createdAt:1}),name:edit.name,characterSheet:edit.sheet,updatedAt:2};return characterEditBaseline(person,[person],{revision:"1",presentIds:[],states:{[person.id]:edit.state},updatedAt:2});}}));
</script></body></html>
