<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepRole metadata repair worker</title></head><body>
<aside><div id="owned"><a href="https://chat.deepseek.com/chat/s/owned">Service</a><button id="more" aria-label="More">…</button></div><div id="foreign"><a href="https://chat.deepseek.com/chat/s/personal">Personal</a><button id="foreign-more" aria-label="More">…</button></div></aside><main id="turns"></main><form><textarea aria-label="Message"></textarea><button type="submit">Send</button><button type="button" data-testid="stop-generation" hidden>Stop</button></form>
<script>const area=()=>{const values=new Map();return{get:async key=>key?{[key]:values.get(key)}:Object.fromEntries(values),set:async v=>{for(const[k,val]of Object.entries(v))values.set(k,val)},remove:async keys=>keys.forEach(k=>values.delete(k))}};const listeners=new Set();window.chrome={runtime:{id:"fixture",sendMessage:async()=>{},onMessage:{addListener(fn){listeners.add(fn)},removeListener(fn){listeners.delete(fn)}}},storage:{local:area(),session:area(),onChanged:{addListener(){},removeListener(){}}}};window.cleanupListeners=listeners;</script>
<script type="module">
import {storyWorld} from "/tests/fixtures/story-worlds.ts";
import {repository} from "/src/storage/repository.ts";
import {DEFAULT_SETTINGS} from "/src/core/defaults.ts";
import {characterRevision} from "/src/core/characters.ts";
import {nativeStoryMessageKey as key} from "/src/core/story-transport.ts";
import {runStoryGame} from "/src/storage/story-game.ts";
import {readStoryReview} from "/src/storage/story-review.ts";
import {IsolatedFieldCoordinator} from "/src/adapters/isolated-field-coordinator.ts";
import {StoryRepairClient} from "/src/adapters/story-repair-client.ts";
import {startIsolatedFieldWorker} from "/src/adapters/isolated-field-worker.ts";
import {bootstrapFieldServiceScreen} from "/src/adapters/field-service-screen.ts";
const query=new URLSearchParams(location.search),locale=query.get("locale")==="en"?"en":"ru",hold=query.get("hold")==="true";document.documentElement.lang=locale;
await repository.clear();const f=storyWorld(locale);await repository.mergeRecords(f.records);
const message=(id,parent,role,content)=>({identity:{nativeMessageKey:key(id),nativeParentKey:parent===null?null:key(parent),role},completion:"complete",content});
const snapshot={chatId:f.binding.chatId,selectedNativeKey:key("2"),messages:[message("1",null,"user","Begin"),message("2","1","assistant","Workshop")]};
async function play(operation="sync"){const b=await repository.get("binding",f.binding.id);return runStoryGame({chatId:b.chatId,worldId:f.world.id,expectedBase:characterRevision(f.entities,b.characterScenes[f.world.id]),operation,snapshot,nativeParentKey:null,manual:"stop"},DEFAULT_SETTINGS,repository)}
await play("start");const scope={chatId:f.binding.chatId,worldId:f.world.id,cursor:null},branch=(await readStoryReview(scope)).guard.branchId;
const prose="Mira waits at the gate. Her goal is to find the copper key.";
const original=prose+`<deeprole_characters>${JSON.stringify({version:2,world:f.world.id,chat:f.binding.chatId,branch,updates:[{id:"person-1",state:{condition:"At the gate",goal:23}}]})}</deeprole_characters>`;
snapshot.messages.push(message("3","2","user","Act"),message("4","3","assistant",original));snapshot.selectedNativeKey=key("4");await play();const review=await readStoryReview(scope),input={worldId:f.world.id,chatId:f.binding.chatId,revisionId:review.currentRevisionId,guard:review.guard};
window.repairFixture={sent:[],removed:[],deleted:0,foreignClicks:0,finished:false,original};document.getElementById("foreign-more").onclick=()=>window.repairFixture.foreignClicks++;
const tabs=new Map([[1,{id:1,url:f.binding.chatUrl,active:true}]]),api={runtime:{id:"fixture"},storage:window.chrome.storage,windows:{create:async v=>{window.repairFixture.popup=v;tabs.set(2,{id:2,url:v.url,active:true});return{id:3,tabs:[tabs.get(2)]}}},tabs:{get:async id=>{if(!tabs.has(id))throw Error("closed");return tabs.get(id)},query:async()=>[tabs.get(2)],update:async(id,v)=>{tabs.set(id,{...tabs.get(id),...v});return tabs.get(id)},remove:async id=>{window.repairFixture.removed.push(id);tabs.delete(id)},sendMessage:async(id,m)=>{if(id===2)for(const fn of window.cleanupListeners)await fn(m);return{ok:true}}}};
const coordinator=new IsolatedFieldCoordinator(repository,api,async()=>({...DEFAULT_SETTINGS,locale})),source={id:"fixture",tab:{id:1},frameId:0};
const client=new StoryRepairClient(m=>coordinator.handle(m,source));client.run(input,()=>true).then(v=>window.repairFixture.result=v,e=>window.repairFixture.error=e.message).finally(()=>window.repairFixture.finished=true);
while(!tabs.get(2)?.url?.includes("deeprole_field_job"))await new Promise(r=>setTimeout(r,20));const url=new URL(tabs.get(2).url);history.replaceState({},"",url.pathname+url.search);bootstrapFieldServiceScreen();
window.chrome.runtime.sendMessage=m=>{tabs.set(2,{...tabs.get(2),url:"https://chat.deepseek.com"+location.pathname+location.search});return coordinator.handle(m,{id:"fixture",tab:{id:2},frameId:0})};
const stop=document.querySelector("[data-testid=stop-generation]");document.querySelector("form").onsubmit=e=>{e.preventDefault();const prompt=document.querySelector("textarea").value;window.repairFixture.sent.push(prompt);document.querySelector("textarea").value="";history.replaceState({},"","/chat/s/owned");document.getElementById("turns").innerHTML='<article data-role="user"><p></p></article><article data-role="assistant"><div class="ds-think-content">PRIVATE_SYNTHETIC_REASONING</div><div class="ds-markdown"></div></article>';document.querySelector("article p").textContent=prompt;stop.hidden=false;if(!hold)setTimeout(()=>{const requestId=prompt.match(/\[Request ID: ([^\]]+)\]/)[1];document.querySelector(".ds-markdown").textContent=JSON.stringify({requestId,data:{version:2,world:f.world.id,chat:f.binding.chatId,branch,updates:[{id:"person-1",state:{condition:"Overwrite accepted",goal:"Find copper key"}}]}});stop.hidden=true},400)};stop.onclick=()=>stop.hidden=true;
document.getElementById("more").onclick=()=>{const menu=document.createElement("div");menu.setAttribute("role","menu");menu.innerHTML='<button role="menuitem">Delete chat</button>';document.body.append(menu);menu.querySelector("button").onclick=()=>{menu.remove();const dialog=document.createElement("div");dialog.setAttribute("role","dialog");dialog.innerHTML='<p>Delete chat?</p><button>Delete</button>';document.body.append(dialog);dialog.querySelector("button").onclick=()=>{window.repairFixture.deleted++;document.getElementById("owned").remove();document.getElementById("turns").replaceChildren();dialog.remove();history.replaceState({},"","/")}}};
window.repairFixture.read=async()=>({page:await readStoryReview(scope),source:await repository.get("story",input.revisionId),binding:await repository.get("binding",f.binding.id)});await startIsolatedFieldWorker();
</script></body></html>
